<header class="site-header">
  <a class="site-name" href="{{ site.url }}/" aria-label="{{ site.title }} home"
    >{{ site.title }}</a
  >

  <nav class="site-nav" aria-label="Primary navigation">
    <a href="{{ site.url }}/" aria-current="{% if page.title == 'Home' %}page{% else %}false{% endif %}">Writing</a>
    <a href="{{ site.url }}/about/" aria-current="{% if page.url == '/about/' %}page{% else %}false{% endif %}">About</a>
    <a href="{{ site.url }}/talks/" aria-current="{% if page.url == '/talks/' %}page{% else %}false{% endif %}">Talks</a>
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Dark mode" aria-checked="false" hidden>
      <span class="theme-toggle-thumb" aria-hidden="true"></span>
      <svg class="theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
      </svg>
      <svg class="theme-toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
      </svg>
    </button>
  </nav>
</header>
